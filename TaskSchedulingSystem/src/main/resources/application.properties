# ── Server ───────────────────────────────────────────────────────────
server.port=8080

# ── PostgreSQL Database ───────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/promanage_db
spring.datasource.username=postgres
spring.datasource.password=pass
spring.datasource.driver-class-name=org.postgresql.Driver

# ── Connection Pool (HikariCP - included by default) ─────────────────
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

# ── Python FastAPI URL ────────────────────────────────────────────────
# Java calls this to get ML predictions
python.api.url=http://localhost:8000

# ── Logging ───────────────────────────────────────────────────────────
logging.level.com.promanage=INFO
logging.level.org.springframework.jdbc=DEBUG
